<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DreamGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
    <style>
      :root {
        --sage: #adbc9c; --sage-deep: #8fa384; --cream: #fbf5ea; --cream-2: #f3ead9;
        --ink: #3f3a2e; --ink-soft: #6f6858; --honey: #c68a4e; --honey-deep: #a86f3b;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --display: "Instrument Serif", var(--serif);
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* --page follows the time of day (set from main.ts); the front page keeps the plain sage. */
      html, body { margin: 0; height: 100%; background: var(--page, var(--sage)); font-family: var(--sans); color: var(--ink); transition: background 1.2s ease; overflow: hidden; }
      body.night #menu-toggle { color: #fbf5ea; } body.night #menu-toggle:hover { background: rgba(255,255,255,0.14); }
      #stage { position: fixed; inset: 0; bottom: var(--panel-h, 0px); left: var(--left-w, 0px); right: var(--right-w, 0px); z-index: 0; transition: left 0.25s ease, right 0.25s ease; }
      body.has-leftbar { --left-w: 0px; }
      body.has-leftbar.leftbar-open { --left-w: 250px; }
      body.has-rightbar.rightbar-open { --right-w: 340px; }
      #stage canvas { position: absolute; inset: 0; }
      body.has-sidebar { --panel-h: 256px; }

      /* Dimension form ------------------------------------------------ */
      #dims { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sage);
              background-image: radial-gradient(60% 50% at 50% 40%, rgba(255,255,255,0.18), transparent 70%); }
      #dims[hidden] { display: none; }
      .card { background: var(--cream); border-radius: 22px; padding: 30px 34px 28px; box-shadow: 0 18px 50px rgba(50,60,40,0.22), inset 0 1px 0 #fff; min-width: 300px; max-width: 440px; box-sizing: border-box; }
      .card h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: 0.01em; margin: 0 0 2px; }
      #dims .card { background: none; box-shadow: none; padding: 0 20px; } /* front page sits straight on the sage */
      .card h1.glass-cloud { display: inline-block; position: relative; --k: 1.5; padding: 10px 2.4em 10px 18px; margin: -2px 0 48px -18px; } /* bottom margin clears the cloud so it never sits under the form */
      .card h1 span { color: #8f7fc9; }
      .card .sub { margin: 0 0 22px; color: var(--ink-soft); font-size: 14px; }
      #dims form { display: grid; gap: 10px; }
      #dims label { display: grid; grid-template-columns: 5em 1fr 1fr; align-items: center; gap: 10px; font-size: 14px; }
      #dims label > span:first-child { font-family: var(--display); font-size: 19px; letter-spacing: -0.01em; }
      /* Number + unit share one soft translucent pill; the pill (not the input) shows focus. */
      #dims .field { display: flex; align-items: baseline; gap: 4px; padding: 9px 14px 9px 4px; border-radius: 999px; background: rgba(255,255,255,0.32); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); transition: background .15s ease, box-shadow .15s ease; }
      #dims .field:hover { background: rgba(255,255,255,0.42); }
      #dims .field:focus-within { background: rgba(255,255,255,0.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), 0 6px 18px rgba(50,60,40,0.12); }
      .unit { color: var(--ink-soft); font-size: 12px; font-weight: 500; }
      #dims input { width: 100%; min-width: 0; box-sizing: border-box; padding: 0 0 0 12px; font: inherit; font-family: var(--sans); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; text-align: right; border: 0; background: none; color: var(--ink); -moz-appearance: textfield; }
      #dims input::-webkit-outer-spin-button, #dims input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      #dims input:focus { outline: none; }
      /* "Build room" is a typographic call to action: italic serif, an arrow that slides, an underline that draws in. */
      #dims button { position: relative; justify-self: center; margin-top: 18px; padding: 6px 4px; font: inherit; font-family: var(--display); font-style: italic; font-size: 30px; letter-spacing: -0.01em; line-height: 1; border: 0; background: none; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
      #dims button .arrow { display: inline-block; font-style: normal; color: #8f7fc9; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
      #dims button::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
      #dims button:hover .arrow { transform: translateX(6px); }
      #dims button:hover::after { transform: scaleX(1); }
      #phone-link { display: block; margin: 10px auto 0; transition: text-shadow 0.18s ease; }
      #dims #phone-link:hover { background: none; text-shadow: 0 0 6px rgba(255,255,255,0.95), 0 0 14px rgba(255,255,255,0.8), 0 0 22px rgba(143,127,201,0.55); }
      #dims button.ghost { display: block; margin: 16px auto 0; font-family: var(--sans); font-style: normal; font-size: 13.5px; font-weight: 500; letter-spacing: 0; color: var(--ink); padding: 4px 8px; }
      #dims button.ghost::after { display: none; }
      .phone-out { margin-top: 14px; font-size: 12px; color: var(--ink-soft); animation: sheet-in .3s cubic-bezier(.2,.8,.2,1); }
      .phone-out[hidden] { display: none; }
      .phone-out .note { margin: 0; text-align: center; }
      .phone-card { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 12px 34px rgba(50,60,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.6); text-align: left; }
      .phone-card .qr { padding: 10px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 1px rgba(63,58,46,0.06); }
      .phone-card .qr canvas { display: block; width: 128px; height: 128px; }
      .phone-body { min-width: 0; }
      .phone-card h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); }
      .phone-card ol { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.55; color: var(--ink-soft); }
      .phone-card ol li::marker { font-weight: 600; color: var(--ink); }
      .phone-url { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px rgba(63,58,46,0.08); }
      .phone-url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); user-select: all; }
      #dims .phone-url .copy { flex: 0 0 auto; margin: 0; padding: 7px 14px; font: inherit; font-size: 11.5px; font-weight: 600; border: 0; border-radius: 999px; background: var(--ink); color: #fff; cursor: pointer; box-shadow: none; }
      #dims .phone-url .copy:hover { background: #000; transform: none; box-shadow: none; }
      .phone-warn { grid-column: 1 / -1; display: block; margin: 0; padding: 8px 12px; border-radius: 12px; background: #fbeae6; color: #a83322; font-size: 11.5px; line-height: 1.4; } .phone-warn b { font-weight: 600; }
      @media (max-width: 520px) { .phone-card { grid-template-columns: 1fr; justify-items: center; text-align: center; } .phone-card ol { text-align: left; } }
      /* Leaves: soft filled shapes with a midrib and veins, swaying gently from their stems. */
      .leaf { position: absolute; width: 200px; pointer-events: none; color: #fbf5ea; --r: 0deg; transform-origin: 8% 92%; transform: rotate(var(--r)); animation: sway 7s ease-in-out infinite alternate; }
      .leaf.tl { left: 5vw; top: 6vh; width: 220px; --r: -28deg; opacity: 0.6; }
      .leaf.tr { right: 12vw; top: 10vh; width: 120px; --r: 190deg; opacity: 0.32; animation-duration: 9s; animation-delay: -3s; }
      .leaf.bl { left: 14vw; bottom: 8vh; width: 130px; --r: 20deg; opacity: 0.34; animation-duration: 8s; animation-delay: -5s; }
      .leaf.br { right: 9vw; bottom: 14vh; width: 220px; --r: 152deg; opacity: 0.6; animation-duration: 8.5s; animation-delay: -2s; }
      @keyframes sway { from { transform: rotate(var(--r)) translateY(0); } to { transform: rotate(calc(var(--r) + 5deg)) translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .leaf { animation: none; } }

      /* In-room chrome ----------------------------------------------- */
      #chrome { position: fixed; inset: 0; bottom: var(--panel-h, 0px); left: var(--left-w, 0px); right: var(--right-w, 0px); pointer-events: none; z-index: 5; transition: left 0.25s ease, right 0.25s ease; }
      #chrome[hidden] { display: none; }
      .chip { position: absolute; top: 18px; padding: 0; background: none; color: var(--ink); font-size: 13px; }
      .textbtn, .chip.action, .time-labels button, #detail .add, #item-tools button { font: inherit; border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
      .textbtn:hover, .chip.action:hover, .time-labels button:hover, #detail .add:hover, #item-tools button:hover { color: var(--honey-deep); }
      /* Hamburger sits on the same centre line as the brand text (brand: top 16 + 8 padding, 22px line box → centre 35px). */
      #menu-toggle { position: fixed; left: 18px; top: 21px; z-index: 9; width: 30px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--ink); padding: 0; transition: background .15s ease; }
      #menu-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      #menu-toggle .back { display: none; } #menu-toggle.open .bars { display: none; } #menu-toggle.open .back { display: block; }
      #menu-toggle:hover { background: rgba(255,255,255,0.35); }
      #menu-toggle[hidden] { display: none; }
      /* liquid-glass cloud behind a logo (.glass-cloud): translucent, backdrop-blurred, faint iridescence, gloss. --k scales it. */
      .glass-cloud { isolation: isolate; --k: 1;
        --puffs:
          radial-gradient(ellipse 38% 34% at 50% 50%, #000 0 55%, transparent 100%),
          radial-gradient(ellipse 19% 10% at 49% 16%, #000 0 55%, transparent 100%),
          radial-gradient(ellipse 28% 12% at 53% 27%, #000 0 58%, transparent 100%),
          radial-gradient(ellipse 36% 13% at 46% 39%, #000 0 60%, transparent 100%),
          radial-gradient(ellipse 43% 14% at 55% 51%, #000 0 62%, transparent 100%),
          radial-gradient(ellipse 33% 12% at 42% 63%, #000 0 60%, transparent 100%),
          radial-gradient(ellipse 24% 10% at 63% 72%, #000 0 58%, transparent 100%),
          radial-gradient(ellipse 22% 6% at 18% 58%, #000 0 45%, transparent 100%),
          radial-gradient(ellipse 24% 6% at 82% 45%, #000 0 45%, transparent 100%),
          radial-gradient(ellipse 14% 5% at 13% 69%, #000 0 45%, transparent 100%),
          radial-gradient(ellipse 13% 36% at 83% 47%, #000 0 62%, transparent 100%),
          radial-gradient(ellipse 9% 31% at 90% 48%, #000 0 62%, transparent 100%),
          radial-gradient(ellipse 7% 8% at 92% 26%, #000 0 50%, transparent 100%),
          radial-gradient(ellipse 6% 6% at 95% 36%, #000 0 50%, transparent 100%),
          radial-gradient(ellipse 6% 6% at 95% 60%, #000 0 50%, transparent 100%),
          radial-gradient(ellipse 8% 7% at 91% 71%, #000 0 50%, transparent 100%),
          radial-gradient(ellipse 22% 13% at 70% 25%, #000 0 55%, transparent 100%),
          radial-gradient(ellipse 12% 11% at 85% 26%, #000 0 52%, transparent 100%); }
      .glass-cloud::before, .glass-cloud::after { content: ""; position: absolute; inset: calc(-22px * var(--k)) calc(-4px * var(--k)) calc(-20px * var(--k)) calc(-56px * var(--k)); z-index: -1; -webkit-mask: var(--puffs); mask: var(--puffs); }
      .glass-cloud::before {
        background:
          radial-gradient(ellipse 55% 70% at 22% 45%, rgba(255,190,225,0.38), transparent 72%),
          radial-gradient(ellipse 50% 65% at 68% 30%, rgba(180,210,255,0.38), transparent 72%),
          radial-gradient(ellipse 60% 55% at 50% 85%, rgba(255,235,180,0.32), transparent 72%),
          linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.30) 55%, rgba(255,255,255,0.50));
        -webkit-backdrop-filter: blur(10px) saturate(1.6) brightness(1.08); backdrop-filter: blur(10px) saturate(1.6) brightness(1.08); }
      .glass-cloud::after {
        background:
          radial-gradient(ellipse 42% 26% at 38% 20%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%),
          radial-gradient(ellipse 30% 18% at 74% 42%, rgba(255,255,255,0.6), rgba(255,255,255,0) 70%),
          radial-gradient(ellipse 60% 22% at 50% 96%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
        mix-blend-mode: screen; }
      .chip.brand { left: 52px; top: 16px; font-family: var(--serif); font-size: 17px; line-height: 22px; padding: 8px 2.4em 8px 16px; background: none; }
      .chip.brand::before, .chip.brand::after { inset: -11px -2px -13px -40px; } /* small logo: keep the cloud inside the top bar */
      .chip.brand span { color: #8f7fc9; } /* lavender "Grid" */
      /* paint roller "painting" the Grid: mirrored, light grey, tilted 45° */
      .roller { position: absolute; right: 0.05em; top: -0.05em; width: 3.55em; height: 3.55em; color: #a3a099; transform: rotate(45deg); transform-origin: 45% 45%; pointer-events: none; }

      /* Top-right toolbar: one frosted pill, icon + label buttons (interior-design-tool style). */
      .topbar { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,0.78); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 8px 28px rgba(40,50,30,0.16), inset 0 0 0 1px rgba(255,255,255,0.6); pointer-events: auto; }
      .topbar .sep { width: 1px; height: 20px; margin: 0 4px; background: rgba(63,58,46,0.14); }
      .topbar .sep:has(+ [hidden]) { display: none; }
      .chip.dims { position: static; padding: 6px 12px 6px 14px; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .chip.action { position: static; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 500; font-family: var(--sans); color: var(--ink); white-space: nowrap; transition: background .15s ease, color .15s ease; }
      .chip.action svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
      .chip.action:hover { background: rgba(63,58,46,0.08); color: var(--ink); }
      .chip.action.on { background: var(--ink); color: #fff; }
      .chip.action.on:hover { background: #000; }
      .chip.action.reset-design.armed { background: #c8412c; color: #fff; }
      #shop-toggle { position: static; font-size: 13px; }
      body.rightbar-open #shop-toggle { display: none; }
      @media (max-width: 1100px) { .chip.action .lbl { display: none; } .chip.action { padding: 8px; } .chip.action.on .lbl, .chip.action.armed .lbl { display: inline; } }
      #measure-label { position: absolute; transform: translate(-50%, -100%); padding: 4px 10px; border-radius: 8px; background: #4d78d6; color: #fff; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 12px rgba(30,50,110,0.3); }
      #measure-label[hidden] { display: none; }
      .chip.action[hidden] { display: none; }
      .chip.mode { left: 20px; top: 62px; pointer-events: auto; cursor: pointer; border: 0; font-family: var(--sans); }
      .chip.mode { display: none; }

      /* Left drawer: saved designs -------------------------------------- */
      #leftbar { position: fixed; top: 0; bottom: 0; left: 0; width: 250px; z-index: 7; box-sizing: border-box; background: var(--cream); box-shadow: 8px 0 30px rgba(40,50,30,0.14); transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; }
      #leftbar[hidden] { display: none; }
      body.leftbar-open #leftbar { transform: none; }
      /* Title centred on the same line as the ☰/← toggle (top 21px + 28px tall → centre 35px). */
      #leftbar .head { box-sizing: border-box; height: 56px; padding: 14px 16px 0 56px; display: flex; align-items: center; justify-content: space-between; }
      #leftbar h2 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0; }
      #leftbar .designs { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
      #leftbar .design { display: grid; grid-template-columns: 64px 1fr 22px; gap: 8px; align-items: center; padding: 8px; border-radius: 3px; background: #fff; box-shadow: 0 1px 3px rgba(40,50,30,0.12); margin-bottom: 8px; cursor: pointer; }
      #leftbar .design:hover { box-shadow: 0 4px 12px rgba(40,50,30,0.18); }
      #leftbar .design.current { outline: 2px solid var(--honey); }
      #leftbar .thumb { width: 64px; height: 40px; border-radius: 2px; background: var(--sage); overflow: hidden; } #leftbar .thumb img { width: 100%; height: 100%; object-fit: cover; }
      #leftbar .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #leftbar .sub { font-size: 10.5px; color: var(--ink-soft); }
      #leftbar .del { border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-size: 12px; } #leftbar .del:hover { color: #c8412c; }
      #leftbar .empty { font-size: 12px; color: var(--ink-soft); padding: 0 6px; line-height: 1.4; }

      /* Save popup */
      #save-popup { position: fixed; inset: 0; z-index: 31; background: rgba(40,46,36,0.35); display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
      #save-popup[hidden] { display: none; }
      #save-popup .sheet { position: relative; width: min(100%, 460px); background: var(--cream); border-radius: 22px; padding: 26px; box-sizing: border-box; box-shadow: 0 24px 70px rgba(30,40,20,0.35); }
      #save-popup .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: #fff; cursor: pointer; font-size: 14px; }
      #save-popup h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 12px; }
      #save-popup h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 14px 0 4px; }
      #save-popup label { display: block; font-size: 13px; color: var(--ink-soft); }
      #save-popup .name { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px 12px; font: inherit; font-size: 16px; border: 1px solid #d9cdb8; border-radius: 10px; background: #fff; color: var(--ink); }
      #save-popup .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      #save-popup .primary { padding: 10px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 999px; background: var(--honey); color: #fff; cursor: pointer; }
      #save-popup .ghost { padding: 10px 14px; font: inherit; border: 0; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; } #save-popup .ghost:hover { background: var(--cream-2); }
      #save-popup .ok { color: #3f7d4e; font-weight: 600; margin: 8px 0 0; }
      #save-popup .sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }
      #save-popup .dims { display: grid; gap: 8px; }
      #save-popup .dims label { display: grid; grid-template-columns: 4.5em 4em auto 4em auto; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
      #save-popup .dims input { width: 100%; box-sizing: border-box; padding: 7px 8px; font: inherit; border: 1px solid #d9cdb8; border-radius: 8px; background: #fff; }
      #save-popup [hidden] { display: none; }

      /* Right drawer: shop browser + agent ------------------------------ */

      #rightbar { position: fixed; top: 0; bottom: 0; right: 0; width: 340px; z-index: 7; box-sizing: border-box; background: var(--cream); box-shadow: -8px 0 30px rgba(40,50,30,0.14); transform: translateX(100%); transition: transform 0.25s ease; display: flex; flex-direction: column; }
      #rightbar[hidden] { display: none; }
      body.rightbar-open #rightbar { transform: none; }
      #rightbar .head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px 10px; }
      #rightbar h2 { flex: 1; font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0; }
      #rightbar .collapse { font: inherit; font-size: 22px; line-height: 1; border: 0; background: none; cursor: pointer; color: var(--ink); padding: 2px 6px; }
      #rightbar .collapse:hover { color: var(--honey-deep); }
      #rightbar .tabs { display: flex; gap: 18px; padding: 0 14px 8px; border-bottom: 1px solid rgba(60,50,40,0.12); margin: 0 0 12px; }
      #rightbar .tab { font: inherit; font-size: 13px; border: 0; background: none; padding: 4px 0; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -9px; }
      #rightbar .tab:hover { color: var(--ink); } #rightbar .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: #8f7fc9; }
      #rightbar .list .shoplist { list-style: none; margin: 0; padding: 0; }
      #rightbar .list .li { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(60,50,40,0.12); }
      #rightbar .list .pic { width: 44px; height: 44px; border-radius: 2px; overflow: hidden; display: block; } #rightbar .list .pic img { width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
      #rightbar .list .li-info { min-width: 0; font-size: 12.5px; line-height: 1.35; }
      #rightbar .list .li-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #rightbar .list .li-title small { font-weight: 500; color: var(--ink-soft); }
      #rightbar .list .li-meta { display: block; font-size: 11px; color: var(--ink-soft); }

        <button class="chip action" id="shared" type="button" hidden><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg><span class="lbl">Shared plan · Edit a copy</span></button>

        <button class="chip action reset-design" id="reset-design" type="button" hidden><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">Reset</span></button>
        <button class="chip action measure" id="measure" type="button" hidden><svg viewBox="0 0 24 24"><path d="M2.5 16.5 16.5 2.5l5 5-14 14z"/><path d="m6.5 12.5 2 2"/><path d="m9.5 9.5 2 2"/><path d="m12.5 6.5 2 2"/></svg><span class="lbl">Measure</span></button>
        <button class="chip action budget" id="budget" type="button" hidden><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg><span class="lbl">Budget</span></button>
        <span class="sep"></span>
        <button class="chip action home" id="home" type="button" title="Back to the start page"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span class="lbl">Home</span></button>
        <button type="button" id="shop-toggle" class="chip action" title="Shop for furniture" hidden><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Shop</span></button>
      </div>
      <div id="measure-label" hidden></div>
      <div id="views" hidden>
        <button type="button" data-view="corner">Corner</button>
        <button type="button" data-view="top">Top</button>
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="side">Side</button>
      </div>
      <div id="hint" hidden></div>
      <div id="warn" hidden></div>
      <div id="item-tools" hidden>
        <button type="button" id="tool-state" class="text" hidden aria-pressed="false">Open fridge</button>
        <button type="button" id="tool-rotate" title="Rotate 90° (R)" aria-label="Rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
        <button type="button" id="tool-up" title="Move up the wall" aria-label="Move up"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
        <button type="button" id="tool-down" title="Move down the wall" aria-label="Move down"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
        <button type="button" id="tool-ignore" class="text" hidden>Ignore overlap</button>
        <button type="button" id="tool-delete" title="Remove (Delete)" aria-label="Remove"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      </div>
    </div>

    <div id="detail" hidden></div>
    <div id="import-popup" hidden></div>
    <div id="checkout-popup" hidden></div>
    <div id="share-popup" hidden></div>

    <div id="menu" hidden>
      <div class="menu-label">Add a window</div>
      <div class="menu-row">
        <button type="button" data-add-window data-shape="rect" title="Rectangle window"><svg viewBox="0 0 40 40"><rect x="7" y="6" width="26" height="28" rx="2"/><path d="M20 6v28"/><path d="M7 20h26"/></svg><span>Classic</span></button>
        <button type="button" data-add-window data-shape="arch" title="Arched window"><svg viewBox="0 0 40 40"><path d="M7 34V19a13 13 0 0 1 26 0v15z"/><path d="M20 6v28"/><path d="M7 20h26"/><path d="M11 19a9 9 0 0 1 18 0"/></svg><span>Arched</span></button>
        <button type="button" data-add-window data-shape="semi" title="Half-round window"><svg viewBox="0 0 40 40"><path d="M6 28a14 14 0 0 1 28 0z"/><path d="M20 14v14"/><path d="m10.1 18.1 9.9 9.9 9.9-9.9"/></svg><span>Half-round</span></button>
        <button type="button" data-add-window data-shape="oval" title="Oval window"><svg viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="10" ry="14"/><path d="M20 6v28"/><path d="M10 20h20"/></svg><span>Oval</span></button>
      </div>
      <button type="button" data-add-corner><svg viewBox="0 0 40 40"><path d="M6 12 20 8l14 4v20l-14 4L6 32z"/><path d="M20 8v28"/><path d="M6 22 20 18l14 4"/></svg><span>Corner window</span></button>
      <button type="button" data-add-door><svg viewBox="0 0 40 40"><path d="M9 36V6h22v30"/><path d="M5 36h30"/><path d="M14 10h12v26H14z"/><circle cx="23" cy="23" r="1.4" fill="currentColor"/></svg><span>Door</span></button>
      <button type="button" data-remove hidden>Remove</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
