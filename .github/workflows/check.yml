name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    name: Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm test:models
      - run: pnpm -r --if-present build

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api/pyproject.toml
            services/api/constraints-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c services/api/constraints-dev.txt -e 'services/api[dev]'
      - run: python -m ruff check services/api
      - run: python -m mypy --config-file services/api/pyproject.toml services/api/src
      - run: python -m pytest services/api/tests
